name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Стиль и статический анализ
    runs-on: ubuntu-24.04

    steps:
      - name: Забрать код
        uses: actions/checkout@v7

      - name: Поставить PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, pdo_pgsql
          coverage: none

      - name: Поставить зависимости
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: phpcs
        run: composer cs

      - name: phpstan
        run: composer static

  tests:
    name: Тесты
    runs-on: ubuntu-24.04

    steps:
      - name: Забрать код
        uses: actions/checkout@v7

      - name: Поставить PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, pdo_pgsql
          coverage: none

      - name: Поставить зависимости
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Codeception
        run: composer test

  docker:
    name: Прод-образ
    runs-on: ubuntu-24.04

    steps:
      - name: Забрать код
        uses: actions/checkout@v7

      - name: Собрать образ
        run: docker build --target prod -f docker/php/Dockerfile -t neo-tracker/php:ci .

      - name: Проверить, что образ запускается и не от root
        run: |
          docker run --rm neo-tracker/php:ci php -v
          test "$(docker run --rm neo-tracker/php:ci id -un)" = www-data
