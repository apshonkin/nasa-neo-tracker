memory_limit = 256M
expose_php = Off

; часовой пояс приложения задан в конфиге Yii, сам PHP пусть будет в UTC
date.timezone = UTC

display_errors = Off
display_startup_errors = Off
log_errors = On
; ошибки в stderr контейнера, их видно в docker compose logs
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; режим разработки: правки кода подхватываются сразу. В прод-образе - 0, см. opcache-prod.ini
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
