server {
    listen 80 default_server;
    server_name _;

    # наружу смонтирован только web/: конфиги, .env и исходники nginx не видит вообще
    root /app/web;
    index index.php;
    charset utf-8;

    client_max_body_size 1m;
    server_tokens off;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location / {
        # статику (css, js, ассеты) отдаёт сам nginx, остальное - во фронт-контроллер
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        # php - имя сервиса из docker-compose.yml, 9000 - порт php-fpm
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
    }

    # кроме index.php никакой PHP-файл выполняться не должен, в том числе из web/assets
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
